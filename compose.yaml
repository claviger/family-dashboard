services:
  dashboard:
    build: .
    image: family-dashboard:latest
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3000:3000"   # only nginx on this host can reach it
    volumes:
      - dashboard-data:/data

volumes:
  dashboard-data:
