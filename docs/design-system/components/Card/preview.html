<!-- @dsCard group="Layout" height=330 subtitle="Home cards: each panel has its own color" -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.4 2.4 4.6-5"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v9.5h12V10"/><path d="M10 19.5V14h4v5.5"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r=".6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
</defs></svg>
<div class="card-grid" style="max-width:760px">
  <section class="card panel-chores">
    <a class="card-head" href="#"><span class="card-badge"><svg class="icon"><use href="#i-home"/></svg></span><h2>Chores</h2><svg class="icon card-chevron"><use href="#i-chev"/></svg></a>
    <p class="muted small">3 open · 1 up for grabs</p>
    <ul class="rows"><li class="row"><input type="checkbox" class="check" aria-label="Take the bins out"><div class="row-main"><span class="row-title">Take the bins out</span><span class="row-sub">Today</span></div></li></ul>
  </section>
  <section class="card panel-spend">
    <a class="card-head" href="#"><span class="card-badge"><svg class="icon"><use href="#i-wallet"/></svg></span><h2>Spend</h2><svg class="icon card-chevron"><use href="#i-chev"/></svg></a>
    <p class="card-figure">$1,284.50</p>
    <p class="muted small">November so far, $112 less than October</p>
  </section>
  <section class="card panel-calendar">
    <a class="card-head" href="#"><span class="card-badge"><svg class="icon"><use href="#i-cal"/></svg></span><h2>Calendar</h2><svg class="icon card-chevron"><use href="#i-chev"/></svg></a>
    <p class="muted small">Nothing planned. Enjoy it.</p>
  </section>
  <section class="card panel-todo">
    <a class="card-head" href="#"><span class="card-badge"><svg class="icon"><use href="#i-check"/></svg></span><h2>To-do</h2><svg class="icon card-chevron"><use href="#i-chev"/></svg></a>
    <p class="muted small">All done for today.</p>
  </section>
</div>
