<!-- @dsCard group="Lists" height=330 subtitle="To-do and chore rows: open, overdue, claimed, done" -->
<section class="card panel-chores" style="max-width:460px">
  <h3>Yours</h3>
  <ul class="rows">
    <li class="row">
      <input type="checkbox" class="check" aria-label="Water the plants">
      <div class="row-main"><span class="row-title">Water the plants</span><span class="row-sub">Today</span></div>
      <span class="chip chip-neutral">Weekly</span>
    </li>
    <li class="row">
      <input type="checkbox" class="check" aria-label="Take the bins out">
      <div class="row-main"><span class="row-title">Take the bins out</span><span class="row-sub overdue">Overdue since Tuesday</span></div>
      <span class="chip chip-late">2 days late</span>
    </li>
    <li class="row">
      <input type="checkbox" class="check" aria-label="Walk the dog">
      <div class="row-main"><span class="row-title">Walk the dog</span><span class="row-sub">Tomorrow · Maya</span></div>
      <span class="avatar p2" aria-hidden="true">M</span>
    </li>
    <li class="row done">
      <input type="checkbox" class="check" checked aria-label="Empty the dishwasher">
      <div class="row-main"><span class="row-title">Empty the dishwasher</span></div>
    </li>
  </ul>
</section>
